name: Sync fork with upstream

# 自动把本 fork 与上游 EthanYoQ/whisper-input 保持同步。
# - 每天 UTC 03:00（北京时间 11:00）定时；
# - 也支持在 Actions 页面手动 "Run workflow" 立即触发。
# 采用 rebase：把本 fork 上仅有的工作流提交重放到上游最新提交之上，
# 保持线性历史、不产生 merge commit；上游前进时也能继续同步。
# （注：ff-only 方式在本 fork 带有工作流提交时会因分叉而失败，故改 rebase。）

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# 允许 GITHUB_TOKEN 推回本 fork
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream (rebase onto latest)
        env:
          UPSTREAM: https://github.com/EthanYoQ/whisper-input.git
          BRANCH: main
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream "$BRANCH"
          git rebase "upstream/$BRANCH"
          git push --force-with-lease origin "HEAD:$BRANCH"
